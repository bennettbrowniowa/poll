<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Classroom Poll</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="student-page"><main class="student-container"><div class="vote-grid">
<button class="vote-button" data-choice="1">1</button><button class="vote-button" data-choice="2">2</button><button class="vote-button" data-choice="3">3</button><button class="vote-button" data-choice="4">4</button><button class="vote-button" data-choice="5">5</button>
</div><div id="status" class="vote-status" aria-live="polite"></div></main>
<script>
const buttons=document.querySelectorAll(".vote-button"),status=document.getElementById("status");
buttons.forEach(button=>button.addEventListener("click",async()=>{
 buttons.forEach(b=>b.disabled=true); status.textContent="";
 try{let r=await fetch("/api/vote",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({choice:Number(button.dataset.choice)})});
 if(!r.ok)throw Error(); status.textContent="Recorded ✓";
 setTimeout(()=>{status.textContent="";buttons.forEach(b=>b.disabled=false)},500);
 }catch(e){status.textContent="Try again";buttons.forEach(b=>b.disabled=false);}
}));
</script></body></html>

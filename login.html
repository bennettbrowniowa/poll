<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Login</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="teacher-page"><main class="login-container"><h1>Teacher</h1><form method="post" class="login-form"><label for="pin">Teacher PIN</label><input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" autofocus required>{% if error %}<div class="login-error">{{ error }}</div>{% endif %}<button type="submit" class="teacher-action">Log in</button></form></main></body></html>
